name: free_map_review
description: Cross-platform map review application using OpenStreetMap and Supabase.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  osm_nominatim: ^4.0.1
  supabase_flutter: ^2.3.0
  flutter_riverpod: ^2.4.0
  riverpod_annotation: ^2.3.0
  go_router: ^12.0.0
  image_picker: ^1.0.0
  image_cropper: ^5.0.0
  image: ^4.1.0
  shared_preferences: ^2.2.0
  path: ^1.8.0
  path_provider: ^2.1.0
  geolocator: ^10.1.0
  permission_handler: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.0
  riverpod_generator: ^2.3.0
  riverpod_lint: ^2.3.0
  custom_lint: ^0.5.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
